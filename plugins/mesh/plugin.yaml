manifestVersion: "1"
id: mesh
name: Mesh Network
version: 1.0.0
type: system
trusted: true
description: Peer-to-peer mesh network management — nodes, invites, topology

core:
  permissions:
    - id: mesh.read
      capabilities:
        - node.identity.get
        - node.list
        - node.peer.list
        - node.invite.list
      default: ask
    - id: mesh.manage
      capabilities:
        - node.peer.reconnect
        - node.peer.disconnect
        - node.peer.revoke
        - node.invite.create
        - node.invite.accept
        - node.invite.revoke
      default: ask

adapters:
  system-ui:
    views:
      - id: mesh
        surface: main.editor
        type: custom-react
        entry: ./index
        title: Mesh
        icon: Share2
    configuration:
      title: Mesh
      properties:
        autoReconnect:
          type: boolean
          default: true
          description: "Automatically reconnect to peers on connection loss"
        heartbeatInterval:
          type: integer
          default: 30
          minimum: 5
          maximum: 300
          description: "Heartbeat interval in seconds"
