manifestVersion: "1"
id: terminal
name: Terminal
version: 1.0.0
type: plugin
trusted: true
description: Shell session management — create, stream, and replay terminal sessions
author: SessionNode

core:
  permissions:
    - id: terminal.session
      description: Create and manage shell sessions
      capabilities:
        - session.create
        - session.list
        - session.get
        - session.destroy
      default: ask
      constraints:
        targetNodes:
          - self

    - id: terminal.stream
      description: Read and write terminal I/O streams
      capabilities:
        - stream.write
        - stream.subscribe
        - stream.replay
        - stream.tail
      default: ask

    - id: terminal.node
      description: Discover available nodes for terminal target selection
      capabilities:
        - node.list
      default: ask

    - id: terminal.process
      description: Spawn and control shell processes
      capabilities:
        - process.spawn
        - process.signal
        - process.resize
      default: deny

    - id: terminal.run
      description: Create and manage run sessions
      capabilities:
        - run.create
        - run.list
        - run.info
        - run.stop
        - run.attach
        - run.updatePolicy
      default: ask

  environment:
    checks:
      - id: bash
        type: binary
        required: false
        command: bash
        installHint: "Install bash via your package manager"

  history:
    defaultPolicy: memory

adapters:
  system-ui:
    views:
      - id: terminal
        surface: main.editor
        type: custom-react
        entry: ./index
        title: Terminal
        icon: terminal
    configuration:
      title: Terminal
      properties:
        defaultShell:
          type: string
          default: "bash"
          description: "Default shell path used for new terminals"
          enum: ["bash", "zsh", "pwsh", "cmd", "powershell"]
        fontSize:
          type: integer
          default: 12
          minimum: 8
          maximum: 24
          description: "Terminal font size in pixels"
        cursorBlink:
          type: boolean
          default: true
          description: "Enable cursor blinking in the terminal"
    panels:
      - id: terminal.sessions
        surface: panel.bottom
        type: host-rendered
        componentId: SessionListPanel
        title: Sessions
        icon: terminal
      - id: terminal.files
        surface: left
        type: host-rendered
        componentId: FilesPanel
        title: Files
        icon: folder
      - id: terminal.raw
        surface: right
        type: host-rendered
        componentId: TerminalPanel
        title: Raw
        icon: terminal
      - id: terminal.logs
        surface: right
        type: host-rendered
        componentId: LogsPanel
        title: Logs
        icon: scroll-text
      - id: terminal.processes
        surface: right
        type: host-rendered
        componentId: ProcessesPanel
        title: Processes
        icon: cpu

    mobileKeyboard:
      - id: tab
        label: Tab
        send: "\t"
        row: 0
        order: 10
      - id: ctrl
        label: Ctrl
        toggle: true
        toggleKey: ctrl
        row: 0
        order: 20
      - id: alt
        label: Alt
        toggle: true
        toggleKey: alt
        row: 0
        order: 30
      - id: esc
        label: Esc
        send: "\x1b"
        row: 0
        order: 40
      - id: slash
        label: "/"
        send: "/"
        row: 0
        order: 50
      - id: left
        label: "←"
        send: "\x1b[D"
        row: 1
        order: 10
      - id: down
        label: "↓"
        send: "\x1b[B"
        row: 1
        order: 20
      - id: up
        label: "↑"
        send: "\x1b[A"
        row: 1
        order: 30
      - id: right
        label: "→"
        send: "\x1b[C"
        row: 1
        order: 40
