name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_DIR="dist/sessionbridge-web-${VERSION}"
          mkdir -p "$PKG_DIR"/{bin,scripts,.next,public,plugins}

          cp bin/bridge.js "$PKG_DIR/bin/"
          cp scripts/start-core.js "$PKG_DIR/scripts/"
          cp -r .next "$PKG_DIR/"
          cp -r plugins/* "$PKG_DIR/plugins/"
          cp package-lock.json "$PKG_DIR/"

          # public/ may be empty
          if [ "$(ls -A public 2>/dev/null)" ]; then
            cp -r public/* "$PKG_DIR/public/"
          fi

          node -e "
            const p = require('./package.json');
            require('fs').writeFileSync('$PKG_DIR/package.json', JSON.stringify({
              name: 'sessionbridge-web',
              version: '\$VERSION',
              private: true,
              scripts: {
                start: 'node bin/bridge.js',
                'start:web': 'next start',
              },
              dependencies: p.dependencies,
            }, null, 2));
          "

          cd dist
          zip -r "sessionbridge-web-v${VERSION}.zip" "sessionbridge-web-${VERSION}"

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          files: dist/sessionbridge-web-*.zip
          generate_release_notes: true
