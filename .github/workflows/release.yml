# ─── SessionBridge Release Workflow ───────────────────────────────
# On git tag push: build → package → create GitHub Release
#
# Usage:
#   git tag v0.7.0
#   git push origin v0.7.0
#
# Artifacts:
#   - sessionbridge-vX.Y.Z.zip  (linux-x64 portable, Node.js + Go required)
#   - Source code (GitHub auto-attaches)
#
# Go Core is the sole runtime. Legacy Node relay has been retired.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Package (linux-x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Build Go Core
        run: npm run build:core

      - name: Package portable
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_DIR="dist/sessionbridge-${VERSION}"

          mkdir -p "$PKG_DIR"/{bin,scripts,dist/go-core,out,public,plugins}

          # Launcher
          cp bin/bridge.js "$PKG_DIR/bin/"

          # Scripts
          cp scripts/start-core.js "$PKG_DIR/scripts/"
          cp scripts/check-update.js "$PKG_DIR/scripts/"
          cp scripts/update.js "$PKG_DIR/scripts/"

          # Go Core binary (linux-x64)
          cp dist/go-core/sessionnode "$PKG_DIR/dist/go-core/"

          # Frontend static export
          cp -r out/* "$PKG_DIR/out/"

          # Public assets
          cp -r public/* "$PKG_DIR/public/"

          # Plugin manifests
          cp -r plugins/* "$PKG_DIR/plugins/"

          # Portable package.json
          node -e "
            const p = require('./package.json');
            require('fs').writeFileSync('$PKG_DIR/package.json', JSON.stringify({
              name: 'sessionbridge',
              version: '$VERSION',
              private: true,
              description: p.description,
              scripts: {
                start: 'node bin/bridge.js',
                'start:core': 'node scripts/start-core.js',
              },
              dependencies: p.dependencies,
            }, null, 2));
          "

          # Production modules
          npm ci --omit=dev --prefix "$PKG_DIR" 2>/dev/null || true

          # Version info
          node -e "
            require('fs').writeFileSync('$PKG_DIR/.bridge-info',
              JSON.stringify({
                version: '$VERSION',
                builtAt: new Date().toISOString(),
                runtime: 'Go Core (linux-x64)',
                nodeRequired: '>=18',
              }, null, 2));
          "

          # Zip it
          cd dist
          zip -r "sessionbridge-v${VERSION}.zip" "sessionbridge-${VERSION}"
          echo "artifact=dist/sessionbridge-v${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SessionBridge v${{ github.ref_name }}
          body_path: .github/release-template.md
          fail_on_unmatched_text: true
          files: |
            dist/sessionbridge-*.zip
          generate_release_notes: true
